name: iPhone CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: 选择 Xcode 和可用的 iPhone
        run: |
          bash Scripts/xcode.sh
          xcodebuild -version
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          udid=$(python3 Scripts/device.py "$RUNNER_TEMP/devices.json")
          echo "DEVICE=$udid" >> "$GITHUB_ENV"
      - name: 编译并运行单元测试和 UI 测试
        run: |
          set -o pipefail
          xcodebuild test -project Timeline.xcodeproj -scheme Timeline -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -resultBundlePath Tests.xcresult CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-results
          path: |
            Tests.xcresult
            xcodebuild.log
