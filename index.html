<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>我的时间线 · 锦瑟</title><link rel="stylesheet" href="./style.css">
<body>
<header class="sitebar"><a href="#home" class="wordmark"><span aria-hidden="true">锦</span>锦瑟手记</a><nav class="site-nav" aria-label="页面导航"><a href="#home">首页</a><a id="timeline" href="#timeline">时间线</a><a id="calendar" href="#calendar">日历</a></nav></header>
<main>
<section id="landing">
<header class="directory-header"><h1>时间线</h1><button class="glass profile" id="appearance" aria-label="外观设置">锦</button></header>
<h2 class="directory-label">我的时间线</h2>
<div class="directory-list" id="collections"></div>
<div class="glass directory-search" role="search"><span class="search-symbol" aria-hidden="true"></span><input id="directoryQuery" type="search" aria-label="搜索时间线" placeholder="搜索"><button id="voice" aria-label="语音搜索" hidden></button></div>
<p id="voiceFeedback" role="status"></p>
</section>
<section id="journal" hidden>
<header class="mast"><h1 id="heading">我的时间线</h1><div class="actions"><button id="find" aria-label="搜索" aria-expanded="false"></button><button id="add" aria-label="添加事件" title="添加事件">＋</button></div></header>
<input hidden id="query" type="search" placeholder="搜索标题、正文或地点" aria-label="搜索内容">
<div class="tools"><label class="month-control"><span id="monthName"></span><input aria-label="选择月份" id="month" type="month"></label><span id="total"></span><div id="tags" role="group" aria-label="记录标签"></div></div>
<section hidden id="grid" aria-label="月历"></section><section id="rows" aria-label="本月记录"></section></section></main>
<dialog id="editor" aria-labelledby="editorTitle"><form id="form"><div class="bar"><button type="button" id="cancel">取消</button><strong id="editorTitle">添加记录</strong><button class="save">保存</button></div><div class="fields"><label>标题<input name="title" required placeholder="记录的标题"></label><label>正文<textarea name="body" rows="5" placeholder="写下今天的故事…"></textarea></label><div id="preview"></div><label class="attach">＋ 添加照片<input id="files" type="file" accept="image/*" multiple></label><label>日期<input name="date" type="date" required></label><label>地点<input name="place" placeholder="填写地点"></label><label>状态<select name="status"><option>未完成</option><option>暂时挂起</option><option>已完成</option></select></label><label>标签<select name="tag"><option>日常</option><option>旅行</option></select></label><p id="error" role="alert"></p></div></form></dialog>
<dialog id="detail" aria-label="记录详情"><div class="bar"><button id="close">返回</button><strong>记录详情</strong><button id="edit">编辑</button></div><article id="story"></article><button class="delete" id="del">删除记录</button></dialog>
<dialog id="appearanceDialog" aria-labelledby="appearanceTitle"><div class="bar"><strong id="appearanceTitle">外观</strong><button id="closeAppearance">完成</button></div><fieldset><legend>显示模式</legend><label><input name="appearance" type="radio" value="system">跟随系统</label><label><input name="appearance" type="radio" value="light">浅色</label><label><input name="appearance" type="radio" value="dark">深色</label></fieldset></dialog>
<script type="module" src="./app.js"></script></body></html>
