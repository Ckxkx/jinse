name: 发布我的时间线
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 发布方式
        type: choice
        required: true
        options:
          - 仅导出 IPA
          - 导出 IPA 并上传 TestFlight
permissions:
  contents: read
concurrency:
  group: ios-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      TEAM_ID: ${{ vars.TEAM_ID }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - name: 核对所选模式的材料
        env:
          DIST_P12: ${{ secrets.DIST_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APP_PROFILE: ${{ secrets.APP_PROFILE }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -eu
          keys="BUNDLE_ID TEAM_ID DIST_P12 P12_PASSWORD APP_PROFILE"
          if [[ "$MODE" == '导出 IPA 并上传 TestFlight' ]]; then keys+=" ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY"; fi
          missing=0
          for key in $keys; do
            if [[ -z "${!key}" ]]; then echo "::error::缺少 $key"; missing=1; fi
          done
          exit "$missing"
      - run: bash Scripts/xcode.sh && xcodebuild -version
      - name: 导入签名材料并归档
        env:
          DIST_P12: ${{ secrets.DIST_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APP_PROFILE: ${{ secrets.APP_PROFILE }}
        run: bash Scripts/archive.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Timeline-IPA-${{ github.run_number }}-${{ github.run_attempt }}
          path: output/*.ipa
          if-no-files-found: error
      - name: 上传 App Store Connect
        if: inputs.mode == '导出 IPA 并上传 TestFlight'
        env:
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          umask 077
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app --type ios -f output/*.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: 清理签名和上传材料
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/journal.keychain-db" || true
          rm -rf "$RUNNER_TEMP/journal-sign" "$HOME/.appstoreconnect/private_keys"
          if [[ -f "$RUNNER_TEMP/journal-profile-path" ]]; then rm -f "$(cat "$RUNNER_TEMP/journal-profile-path")"; fi
